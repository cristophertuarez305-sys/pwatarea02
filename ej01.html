<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1: Cambio de Estilo al hacer clic</title>

    <style>

        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: lch(75.16% 100.72 133.92);
            text-align: center;
            padding: 50px;
        }

        #miCaja {
            width: 200px;
            height: 200px;
            background-color:rgb(0, 251, 167);
            margin: 20px auto;
            border: black 2px solid;
            color: white;
            display: flex;
            justify-content: center;
            align-items:center;
            border-radius: 10px;
            transition: background-color 0.5s;
        }

        #miBoton {
            padding: 1px 20px;
            font-size: 16px;
            background-color:crimson;
            color: white;
            border: black 1px solid;
            border-radius: 5px;
            cursor: pointer;
        }

        #miBoton:hover {
            background-color: darkred;
        }

    </style>
</head>
<body>

    <h2>Ejercicio 1: Cambio de estilo al hacer click</h2>
        <div id="miCaja">Haga click en el botón</div>
        <button id="miBoton">Cambiar Color</button>
    
    <script>

        const caja = document.getElementById("miCaja");
        const boton = document.getElementById("miBoton");

        const colores = ["#e74c3c", "#2ecc71", "#f1c40f", "#9b59b6", "#e67e22"];
        let indice = 0;

        boton.addEventListener("click", function() {
            indice = indice + 1;
            if (indice >= colores.length) {
                indice = 0;
            }

            caja.style.backgroundColor = colores[indice];
        });
    </script>
</body>
</html>
