<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2: Calculadora Simple</title>

    <style>

                body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 50px;
        }

        .calculadora {
            background-color: #333;
            padding: 20px;
            border-radius: 10px;
            width: 260px;
            margin: 0 auto; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #pantalla {
            width: 100%;
            height: 50px;
            font-size: 24px;
            text-align: right; 
            margin-bottom: 15px;
            padding: 5px;
            border: none;
            border-radius: 5px;
            box-sizing: border-box; 
            background-color: #045f09;
        }

        button {
            width: 50px;
            height: 50px;
            font-size: 18px;
            margin: 3px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #555;
            color: white;
        }

        button:hover {
            background-color: #777;
        }

        .operador {
            background-color: #f39c12;
        }

        .operador:hover {
            background-color: #e67e22;
        }

        .igual {
            background-color: #2ecc71;
        }

        .igual:hover {
            background-color: #27ae60;
        }
        

        .borrar {
            background-color: #e74c3c;
            width: 110px; 
        }
    </style>
</head>
<body>

    <h2>Ejercicio 2: Calculadora Simple</h2>

         <div class="calculadora">

        <input type="text" id="pantalla" readonly>


        <button onclick="agregar('7')">7</button>
        <button onclick="agregar('8')">8</button>
        <button onclick="agregar('9')">9</button>
        <button class="operador" onclick="agregar('/')">/</button>
        <br>

        <button onclick="agregar('4')">4</button>
        <button onclick="agregar('5')">5</button>
        <button onclick="agregar('6')">6</button>
        <button class="operador" onclick="agregar('*')">*</button>
        <br>

        <button onclick="agregar('1')">1</button>
        <button onclick="agregar('2')">2</button>
        <button onclick="agregar('3')">3</button>
        <button class="operador" onclick="agregar('-')">-</button>
        <br>

        <button onclick="agregar('0')">0</button>
        <button onclick="agregar('.')">.</button>
        <button class="igual" onclick="calcular()">=</button>
        <button class="operador" onclick="agregar('+')">+</button>
        <br>

        <button class="borrar" onclick="limpiar()">Borrar (C)</button>
    </div>
    <script>
        const pantalla = document.getElementById("pantalla");

        function agregar(valor) {
            pantalla.value = pantalla.value + valor;
        }

        function calcular() {
            try {
                pantalla.value = eval(pantalla.value);
            } catch (error) {
                pantalla.value = "Error";
            }
        }

        function limpiar() {
            pantalla.value = "";
        }
    </script>
</body>
</html>
