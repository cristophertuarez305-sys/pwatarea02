<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 10: Quiz de Preguntas</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;}
        .quiz-container {
            background-color: rgb(202, 62, 62); padding: 30px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; width: 100%;
        }
        h2 { text-align: center; color: #333; }
        .pregunta { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; color: #444; }
        .opciones button {
            display: block; width: 100%; padding: 12px; margin-bottom: 10px;
            background-color: #e9ecef; border: 1px solid #ced4da; border-radius: 5px;
            font-size: 1rem; cursor: pointer; transition: background 0.2s;
            text-align: left;
        }
        .opciones button:hover { background-color: #dde0e3; }
        .opciones button:disabled { cursor: not-allowed; opacity: 0.7; }
        
        .correcta { background-color: #d4edda !important; border-color: #c3e6cb !important; color: #155724; }
        .incorrecta { background-color: #f8d7da !important; border-color: #f5c6cb !important; color: #721c24; }
        
        #siguiente-btn {
            width: 100%; padding: 12px; background-color: #007bff; color: white;
            border: none; border-radius: 5px; font-size: 1rem; cursor: pointer;
            margin-top: 15px; display: none;
        }
        #siguiente-btn:hover { background-color: #0056b3; }
        
        #resultado { text-align: center; display: none; }
        #resultado h3 { color: #28a745; font-size: 1.5rem; }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz">
        <div id="pregunta-container">
            <div class="pregunta" id="pregunta-texto">Cargando pregunta...</div>
            <div class="opciones" id="opciones-container">
            </div>
            <button id="siguiente-btn" onclick="siguientePregunta()">Siguiente</button>
        </div>
        
        <div id="resultado">
            <h3>¡Juego Terminado!</h3>
            <p>Tu puntuación final es: <strong id="puntaje-final"></strong></p>
            <button id="siguiente-btn" style="display:block; background-color: #28a745;" onclick="reiniciarJuego()">Jugar de nuevo</button>
        </div>
    </div>

    <script>
        const preguntas = [
            {
                pregunta: "¿Qué significa HTML?",
                opciones: ["HyperText Markup Language", "HighText Machine Language", "No tengo idea"],
                respuestaCorrecta: 0
            },
            {
                pregunta: "¿Qué lenguaje se usa para dar estilos a una página web?",
                opciones: ["Python", "CSS", "Java"],
                respuestaCorrecta: 1
            },
            {
                pregunta: "¿Cuál es la etiqueta correcta para insertar un script de JavaScript?",
                opciones: ["<scripting>", "<js>", "<script>"],
                respuestaCorrecta: 2
            }
        ];

        let indicePreguntaActual = 0;
        let puntuacion = 0;

        const preguntaTexto = document.getElementById('pregunta-texto');
        const opcionesContainer = document.getElementById('opciones-container');
        const siguienteBtn = document.getElementById('siguiente-btn');
        const preguntaContainer = document.getElementById('pregunta-container');
        const resultadoContainer = document.getElementById('resultado');
        const puntajeFinal = document.getElementById('puntaje-final');

        function cargarPregunta() {
            siguienteBtn.style.display = 'none';
            opcionesContainer.innerHTML = '';
            
            let preguntaActual = preguntas[indicePreguntaActual];
            preguntaTexto.innerText = preguntaActual.pregunta;

            preguntaActual.opciones.forEach((opcion, index) => {
                const boton = document.createElement('button');
                boton.innerText = opcion;
                boton.onclick = () => seleccionarRespuesta(index, boton);
                opcionesContainer.appendChild(boton);
            });
        }

        function seleccionarRespuesta(indiceSeleccionado, botonSeleccionado) {
            const preguntaActual = preguntas[indicePreguntaActual];
            const botones = opcionesContainer.querySelectorAll('button');

            botones.forEach(btn => btn.disabled = true);

            if (indiceSeleccionado === preguntaActual.respuestaCorrecta) {
                botonSeleccionado.classList.add('correcta');
                puntuacion++;
            } else {
                botonSeleccionado.classList.add('incorrecta');
                botones[preguntaActual.respuestaCorrecta].classList.add('correcta');
            }

            siguienteBtn.style.display = 'block';
            
            if (indicePreguntaActual === preguntas.length - 1) {
                siguienteBtn.innerText = "Ver Resultados";
            }
        }

        function siguientePregunta() {
            indicePreguntaActual++;
            if (indicePreguntaActual < preguntas.length) {
                cargarPregunta();
            } else {
                mostrarResultado();
            }
        }

        function mostrarResultado() {
            preguntaContainer.style.display = 'none';
            resultadoContainer.style.display = 'block';
            puntajeFinal.innerText = `${puntuacion} de ${preguntas.length}`;
        }

        function reiniciarJuego() {
            indicePreguntaActual = 0;
            puntuacion = 0;
            preguntaContainer.style.display = 'block';
            resultadoContainer.style.display = 'none';
            siguienteBtn.innerText = "Siguiente";
            cargarPregunta();
        }

        cargarPregunta();
    </script>
</body>
</html>
