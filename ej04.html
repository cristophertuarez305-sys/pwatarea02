<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reloj Analógico</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background: #754c91; color: white; }
    h1 { color: #e0e0e0; }
    canvas { margin: 20px auto; display: block; }
    a { display: block; margin-top: 30px; color: #ff7a7a; }
  </style>
</head>
<body>
  <h1>Reloj Analógico</h1>
  <canvas id="reloj" width="300" height="300"></canvas>
  <a href="index.html">← Volver al menú</a>

  <script>
    var canvas = document.getElementById("reloj");
    var ctx = canvas.getContext("2d");
    var cx = 150, cy = 150, radio = 130;

    function dibujarReloj() {
      var ahora = new Date();
      var h = ahora.getHours() % 12;
      var m = ahora.getMinutes();
      var s = ahora.getSeconds();

      // Limpiar el canvas
      ctx.clearRect(0, 0, 300, 300);

      // Círculo de fondo
      ctx.beginPath();
      ctx.arc(cx, cy, radio, 0, 2 * Math.PI);
      ctx.fillStyle = "#16213e";
      ctx.fill();
      ctx.strokeStyle = "#e94560";
      ctx.lineWidth = 6;
      ctx.stroke();

      // Números del reloj
      ctx.fillStyle = "white";
      ctx.font = "bold 18px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      for (var i = 1; i <= 12; i++) {
        var angulo = (i * Math.PI / 6) - Math.PI / 2;
        var x = cx + (radio - 22) * Math.cos(angulo);
        var y = cy + (radio - 22) * Math.sin(angulo);
        ctx.fillText(i, x, y);
      }

      // Manecilla de horas
      var anguloH = ((h + m/60) * Math.PI / 6) - Math.PI / 2;
      dibujarManecilla(anguloH, 70, 8, "#e0e0e0");

      // Manecilla de minutos
      var anguloM = ((m + s/60) * Math.PI / 30) - Math.PI / 2;
      dibujarManecilla(anguloM, 95, 5, "#e0e0e0");

      // Manecilla de segundos
      var anguloS = (s * Math.PI / 30) - Math.PI / 2;
      dibujarManecilla(anguloS, 110, 2, "#e94560");

      // Punto central
      ctx.beginPath();
      ctx.arc(cx, cy, 6, 0, 2 * Math.PI);
      ctx.fillStyle = "#e94560";
      ctx.fill();
    }

    function dibujarManecilla(angulo, largo, grosor, color) {
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + largo * Math.cos(angulo), cy + largo * Math.sin(angulo));
      ctx.strokeStyle = color;
      ctx.lineWidth = grosor;
      ctx.lineCap = "round";
      ctx.stroke();
    }

    // Actualizar el reloj cada segundo
    setInterval(dibujarReloj, 1000);
    dibujarReloj(); // Dibujar de inmediato al cargar
  </script>
</body>
</html>
