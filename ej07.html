<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 7: Menú Desplegable</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fdf2f2;
            color: #333;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: #7f1d1d;
            padding: 30px 20px;
            box-shadow: 5px 0 15px rgba(0,0,0,0.1);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #ffffff;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .menu-btn {
            width: 100%;
            background: #dc2626;
            color: #ffffff;
            border: none;
            padding: 15px 20px;
            text-align: left;
            font-size: 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-btn:hover {
            background: #ef4444;
            transform: translateX(5px);
        }

        .menu-btn.active {
            background: #fca5a5;
            color: #7f1d1d;
            font-weight: 600;
        }

        .arrow {
            transition: transform 0.3s ease;
        }

        .menu-btn.active .arrow {
            transform: rotate(180deg);
        }

        .submenu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
            background: #fef2f2;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .submenu a {
            display: block;
            padding: 12px 20px 12px 40px;
            text-decoration: none;
            color: #991b1b;
            font-size: 15px;
            transition: all 0.3s;
            border-left: 3px solid transparent;
        }

        .submenu a:hover {
            color: #7f1d1d;
            background: #fee2e2;
            border-left: 3px solid #dc2626;
        }

        .main-content {
            margin-left: 260px;
            padding: 50px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .main-content h1 {
            font-size: 2.5rem;
            color: #991b1b;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }
            .main-content {
                margin-left: 0;
                padding: 30px;
            }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2>Menú</h2>
        
        <div class="menu-item">
            <button class="menu-btn" onclick="toggleMenu(this, 'sub1')">
                Inicio <span class="arrow">▼</span>
            </button>
            <div class="submenu" id="sub1">
                <a href="#">Bienvenida</a>
                <a href="#">Novedades</a>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-btn" onclick="toggleMenu(this, 'sub2')">
                Servicios <span class="arrow">▼</span>
            </button>
            <div class="submenu" id="sub2">
                <a href="#">Horarios de atención</a>
                <a href="#">Sucursales</a>
            </div>
        </div>

        <div class="menu-item">
            <button class="menu-btn" onclick="toggleMenu(this, 'sub3')">
                Contacto <span class="arrow">▼</span>
            </button>
            <div class="submenu" id="sub3">
                <a href="#">Formulario</a>
                <a href="#">Redes Sociales</a>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <h1>Menú desplegable</h1>
    </main>

    <script>
        function toggleMenu(boton, idSubmenu) {
            let submenu = document.getElementById(idSubmenu);
            let todosLosBotones = document.querySelectorAll('.menu-btn');
            let todosLosSubmenus = document.querySelectorAll('.submenu');

            if (submenu.style.maxHeight) {
                submenu.style.maxHeight = null;
                boton.classList.remove('active');
            } else {
                todosLosSubmenus.forEach(menu => menu.style.maxHeight = null);
                todosLosBotones.forEach(btn => btn.classList.remove('active'));
                
                submenu.style.maxHeight = submenu.scrollHeight + "px";
                boton.classList.add('active');
            }
        }
    </script>
</body>
</html>
